name: Windows baseline crash diagnostics
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-crash-diagnostics
  cancel-in-progress: false
jobs:
  extract:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Prepare disposable runner storage and forensic tools
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          sudo apt-get update
          sudo apt-get install -y qemu-utils sleuthkit
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: .zig-cache/ci-vm-windows/baseline-cache
          key: windows-base-v1-1c24e0f47c3f943df429d36e4fcfc7aceebe03362a5f63c62ee7b692f72151a8
          fail-on-cache-miss: true
      - name: Verify cached bytes and extract Windows crash evidence read-only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          cache=Path('.zig-cache/ci-vm-windows/baseline-cache')
          manifest=json.loads((cache/'manifest.json').read_text())
          assert manifest['key']=='windows-base-v1-1c24e0f47c3f943df429d36e4fcfc7aceebe03362a5f63c62ee7b692f72151a8'
          for name,expected in manifest['files'].items():
              path=cache/name
              assert path.parent==cache and not path.is_symlink()
              assert expected=={'sha256':hashlib.file_digest(path.open('rb'),'sha256').hexdigest(),'size':path.stat().st_size}
          PY
          qemu-img convert -f qcow2 -O raw .zig-cache/ci-vm-windows/baseline-cache/windows.qcow2 "$RUNNER_TEMP/windows.raw"
          chmod 444 "$RUNNER_TEMP/windows.raw"
          python3 test/vm/extract-windows-crash.py "$RUNNER_TEMP/windows.raw" crash-evidence
          cp .zig-cache/ci-vm-windows/baseline-cache/manifest.json crash-evidence/cache-manifest.json
          cp .zig-cache/ci-vm-windows/baseline-cache/baseline.json crash-evidence/baseline.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: windows-crash-evidence
          path: crash-evidence/
          if-no-files-found: error
          retention-days: 14
  analyze:
    needs: extract
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: windows-crash-evidence
          path: crash-evidence
      - name: Decode system events and analyze available kernel dumps
        shell: pwsh
        run: |
          New-Item -ItemType Directory analysis | Out-Null
          foreach ($eventLog in Get-ChildItem crash-evidence -Filter System.evtx -Recurse) {
            $events = Get-WinEvent -Path $eventLog.FullName -Oldest -ErrorAction Continue
            $selected = $events | Where-Object { $_.Id -in @(41,1001,1074,6008,7040,7045) }
            $selected | Select-Object TimeCreated,Id,ProviderName,Message | Format-List | Out-File analysis/system-events.txt
            ('<Events>' + (($selected | ForEach-Object { $_.ToXml() }) -join "`n") + '</Events>') | Set-Content analysis/system-events.xml
          }
          $dumps = @(Get-ChildItem crash-evidence -Filter '*.dmp' -Recurse)
          if ($dumps.Count -gt 0) {
            $debugger = 'C:\Program Files (x86)\Windows Kits\10\Debuggers\x64\kd.exe'
            if (-not (Test-Path $debugger)) {
              $installer = Join-Path $env:RUNNER_TEMP winsdksetup.exe
              Invoke-WebRequest 'https://download.microsoft.com/download/e6cfffdc-0d3e-4c6c-96d7-d491da459a07/KIT_BUNDLE_WINDOWSSDK_MEDIACREATION/winsdksetup.exe' -OutFile $installer
              $signature = Get-AuthenticodeSignature $installer
              if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'Microsoft Corporation') { throw 'Invalid Microsoft SDK installer signature' }
              $install = Start-Process $installer -ArgumentList '/quiet','/norestart','/features','OptionId.WindowsDesktopDebuggers' -PassThru -Wait
              if ($install.ExitCode -notin @(0,3010)) { throw "SDK debugger installation failed: $($install.ExitCode)" }
            }
            if (-not (Test-Path $debugger)) { throw 'Kernel debugger is unavailable' }
            $symbols = Join-Path $env:RUNNER_TEMP symbols
            foreach ($dump in $dumps) {
              $log = Join-Path $PWD ('analysis/' + $dump.Name + '.txt')
              & $debugger -y "srv*$symbols*https://msdl.microsoft.com/download/symbols" -z $dump.FullName -logo $log -c '!analyze -v; .bugcheck; kv; lm t n; q'
              if ($LASTEXITCODE -ne 0) { throw "Kernel dump analysis failed: $LASTEXITCODE" }
            }
          } else {
            'No kernel dump was present in the frozen baseline.' | Set-Content analysis/no-dump.txt
          }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: windows-crash-analysis
          path: analysis/
          if-no-files-found: error
          retention-days: 14
