name: Release Pizza
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
  attestations: read
jobs:
  dependency:
    runs-on: ubuntu-26.04
    outputs:
      maintenance: ${{ steps.locked.outputs.maintenance }}
      bundle: ${{ steps.locked.outputs.bundle }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: node tools/install-zig.mjs
      - name: Verify the published maintenance dependency
        id: locked
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 test/release/published-maintenance.py --destination "$RUNNER_TEMP/locked-maintenance"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: locked-maintenance
          path: ${{ runner.temp }}/locked-maintenance/
          if-no-files-found: error
  candidate:
    needs: dependency
    uses: ./.github/workflows/candidate.yml
    with:
      host-ref: ${{ github.sha }}
      maintenance-ref: ${{ needs.dependency.outputs.maintenance }}
      bundle-ref: ${{ needs.dependency.outputs.bundle }}
      maintenance-artifact: locked-maintenance
  release:
    needs: candidate
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: pizza-*-x86_64
          path: dist
          merge-multiple: true
      - name: Check complete installation packages
        run: |
          tar -tzf dist/pizza-linux-x86_64.tar.gz | grep -Fx './bin/maint.efi'
          unzip -l dist/pizza-windows-x86_64.zip | grep -F 'bin/maint.efi'
          cd dist
          sha256sum *.tar.gz *.zip > SHA256SUMS
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        if: startsWith(github.ref, 'refs/tags/v')
        id: attest
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
      - name: Publish tested release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          ATTESTATION: ${{ steps.attest.outputs.bundle-path }}
        run: |
          cp "$ATTESTATION" dist/attestation.json
          gh release create "$RELEASE_TAG" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag --title "$RELEASE_TAG" --generate-notes
