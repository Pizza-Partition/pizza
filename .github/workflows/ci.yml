name: transition-scaffold
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
env:
  GH_TOKEN: ${{ github.token }}
  ZIG: zig
jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install locked Zig nightly
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import path from 'node:path';
          import { createHash } from 'node:crypto';
          import { execFileSync } from 'node:child_process';
          const lock = JSON.parse(fs.readFileSync('config/toolchain.json', 'utf8'));
          const source = lock['x86_64-linux'];
          const response = await fetch(source.url);
          if (!response.ok) throw new Error(`Zig download: ${response.status}`);
          const bytes = Buffer.from(await response.arrayBuffer());
          if (createHash('sha256').update(bytes).digest('hex') !== source.sha256)
            throw new Error('Zig archive SHA-256 mismatch');
          const directory = fs.mkdtempSync(path.join(process.env.RUNNER_TEMP, 'pizza-zig-'));
          const archive = path.join(directory, 'zig.tar.xz');
          fs.writeFileSync(archive, bytes);
          execFileSync('tar', ['-xJf', archive, '-C', directory]);
          const installed = path.join(directory, `zig-x86_64-linux-${lock.version}`);
          if (execFileSync(path.join(installed, 'zig'), ['version'], { encoding: 'utf8' }).trim() !== lock.version)
            throw new Error('Zig version mismatch');
          fs.appendFileSync(process.env.GITHUB_PATH, `${installed}\n`);
          JS
      - name: Install build and bundle tools
        run: sudo apt-get update && sudo apt-get install -y clang-format binutils libarchive-tools
      - name: Build, validate and test
        run: |
          zig build deps
          zig build fmt-check
          zig build doctor all test
      - name: Build static release artifacts
        run: zig build -Doptimize=safe
      - name: Assert static PID 1 binary
        run: |
          if readelf -lW zig-out/bin/pizza-init | grep -q INTERP; then
            echo 'Maintenance PID1 must not resolve host libc'; exit 1
          fi

# VM, full-transition and distro-matrix jobs require explicit kernel/image
# fixtures. They are not silently skipped or represented as green acceptance.
