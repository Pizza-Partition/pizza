name: pizza-host
on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      host-ref:
        type: string
        default: ''
      maintenance-artifact:
        type: string
        default: ''
permissions:
  contents: read
env:
  GH_TOKEN: ${{ github.token }}
  ZIG: zig
jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: Pizza-Partition/Pizza
          ref: ${{ inputs.host-ref || github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        if: inputs.maintenance-artifact != ''
        with:
          name: ${{ inputs.maintenance-artifact }}
          path: candidate/maintenance
      - name: Bind this build to the tested maintenance candidate
        if: inputs.maintenance-artifact != ''
        shell: bash
        run: |
          python test/release/candidate.py verify --root candidate/maintenance --protocol vendor/pizza-protocol
          python -c 'from pathlib import Path; print("PIZZA_MAINTENANCE_SOURCE=" + str(Path("candidate/maintenance").resolve()))' >> "$GITHUB_ENV"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install locked Zig 0.17.1
        run: node tools/install-zig.mjs
      - name: Verify shared sources and toolchain installation rules
        run: |
          node tools/sync-shared.mjs --check
          node --test tools/install-zig.test.mjs
          python3 -m unittest discover -s test/release -v
      - name: Install system backend dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libblockdev-dev libblockdev-part3 libblockdev-fs3 libglib2.0-dev libblkid-dev libsystemd-dev e2fsprogs
      - name: Check and test host
        run: |
          zig build fmt-check check test test-domain test-host-image test-vm-cli test-vm-common test-vm-config test-vm-download test-vm-console
          node --test ui/partition/test/*.test.mjs
          zig build -Doptimize=safe
      - name: Compile backend without GUI dependencies
        run: zig build -Dheadless=true --prefix "$RUNNER_TEMP/pizza-headless"
      - name: Install locked browser test dependencies
        working-directory: ui
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Test browser layouts and user journeys
        timeout-minutes: 5
        run: node ui/partition/test/layout.browser.mjs
      - name: Compile VM artifact builder
        run: |
          zig build compile-linux-vm -Dheadless=true
          zig build build-windows-vm-artifacts -Dheadless=true -- --help
      - name: Check system-linked installation
        run: |
          test -f zig-out/share/applications/pizza.desktop
          readelf -dW zig-out/bin/pizza | grep -F 'libblockdev.so.3'
          readelf -dW zig-out/bin/pizza | grep -F 'libsystemd.so.0'
          zig-out/bin/pizza inventory > "$RUNNER_TEMP/pizza-inventory.json"
      - name: Cross-compile Windows backend
        run: zig build compile -Dtarget=x86_64-windows-gnu -Dwindows-lld=true
      - name: Verify staged candidate before packaging
        if: inputs.maintenance-artifact != ''
        shell: bash
        run: python test/release/candidate.py verify --root candidate/maintenance --protocol vendor/pizza-protocol --stage zig-out
      - name: Package tested Linux installation
        run: |
          mkdir -p dist
          tar -czf dist/pizza-linux-x86_64.tar.gz -C zig-out .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pizza-linux-x86_64
          path: dist/*.tar.gz
          if-no-files-found: error
  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: Pizza-Partition/Pizza
          ref: ${{ inputs.host-ref || github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        if: inputs.maintenance-artifact != ''
        with:
          name: ${{ inputs.maintenance-artifact }}
          path: candidate/maintenance
      - name: Bind this build to the tested maintenance candidate
        if: inputs.maintenance-artifact != ''
        shell: bash
        run: |
          python test/release/candidate.py verify --root candidate/maintenance --protocol vendor/pizza-protocol
          python -c 'from pathlib import Path; print("PIZZA_MAINTENANCE_SOURCE=" + str(Path("candidate/maintenance").resolve()))' >> "$GITHUB_ENV"
      - name: Install locked Zig 0.17.1
        shell: pwsh
        run: node tools/install-zig.mjs
      - name: Compile and test Windows backend
        shell: pwsh
        run: |
          zig build fmt-check check test-domain -Dwindows-lld=true
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          zig build -Doptimize=safe -Dwindows-lld=true
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./zig-out/bin/pizza.exe inventory | Out-File -Encoding utf8 (Join-Path $env:RUNNER_TEMP 'pizza-inventory.json')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Accept Windows writes on a private temporary VHDX
        timeout-minutes: 10
        shell: pwsh
        run: |
          zig build test-windows-image -Dheadless=true -Dwindows-lld=true --summary all
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify staged candidate before packaging
        if: inputs.maintenance-artifact != ''
        shell: bash
        run: python test/release/candidate.py verify --root candidate/maintenance --protocol vendor/pizza-protocol --stage zig-out
      - name: Package tested Windows installation
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path zig-out/* -DestinationPath dist/pizza-windows-x86_64.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pizza-windows-x86_64
          path: dist/*.zip
          if-no-files-found: error
